<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe5d3"><title>桃屋 — パスワード再設定</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#efe5d3;color:#482d2b;font-family:system-ui,sans-serif}
.card{width:min(100%,420px);padding:34px;background:rgba(250,246,237,.95);border:1px solid rgba(184,19,46,.2);box-shadow:0 20px 60px #5b35201a}
h1{margin:0;text-align:center;color:#b8132e;font-family:Georgia,serif}.en{display:block;margin-top:3px;font-size:.88em;font-weight:400;letter-spacing:0}p{font-size:13px;line-height:1.7;color:#8b6e62;text-align:center}
label{display:block;font-size:12px;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #d7c6b7;background:#fffaf2;font:inherit}
button{width:100%;margin-top:18px;padding:14px;border:0;background:#b8132e;color:#fff8ec;font:inherit;font-weight:700;cursor:pointer}
#msg{display:none;text-align:left;background:#f8eee5;padding:12px;margin-top:15px;overflow-wrap:anywhere}a{color:#b8132e}
</style>
</head>
<body><main class="card">
<p>桃屋 · MOMOYA<br><span class="en">Peach Shop · Momoya</span></p><h1>新しいパスワード<span class="en">Set a new password</span></h1><p>新しいパスワードを設定してください。<span class="en">Choose a new password for your account.</span></p>
<form id="form"><label for="password">新しいパスワード（6文字以上）<span class="en">New password (at least 6 characters)</span></label><input id="password" type="password" minlength="6" autocomplete="new-password" required><button id="submit" type="submit">パスワードを更新 / Update password</button><p id="msg" role="status" aria-live="polite"></p></form>
<p><a href="login.html">ログインに戻る / Back to log in</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
 const supabase = window.supabase.createClient('https://afmsmwxgsozeumwrtizy.supabase.co','sb_publishable_MhIkypUfFOXtVln_v7HGyA_qv8shQo9');
 const form=document.getElementById('form'),msg=document.getElementById('msg'),btn=document.getElementById('submit');
 const say=t=>{msg.style.display='block';msg.textContent=t;};
 supabase.auth.onAuthStateChange(async (event) => {
   if(event==='PASSWORD_RECOVERY') say('新しいパスワードを入力してください。 / Enter your new password.');
 });
 form.addEventListener('submit',async e=>{
   e.preventDefault();btn.disabled=true;btn.textContent='更新中… / Updating…';
   try {
     const {error}=await supabase.auth.updateUser({password:document.getElementById('password').value});
     if(error) throw error;
     say('パスワードを更新しました。ログインページへ戻ってください。 / Password updated. Returning to log in.');
     setTimeout(()=>location.assign('login.html'),1200);
   } catch(error) { say((error.message || 'パスワードを更新できませんでした。再設定メールのリンクを開き直してください。') + ' / Could not update password. Reopen the reset email link.'); }
   finally {btn.disabled=false;btn.textContent='パスワードを更新 / Update password';}
 });
})();
</script></body></html>
